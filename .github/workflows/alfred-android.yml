name: Alfred Android compatibility
on:
  workflow_dispatch:
    inputs:
      reuse_build_run:
        description: Optional existing verified APK build run; skips compilation
        required: false
        type: string
      apis:
        description: JSON array of affected API levels; default checks Android 11–16
        required: false
        default: '[30,31,32,33,34,35,36]'
        type: string
  push:
    paths: ['app/**', 'shared/**', 'feature-*/**', 'native/**', 'scripts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'core-dependency.json', '!**/*.md', '!scripts/emulator-smoke.py', '!scripts/jobs-smoke.py', '!scripts/saf-ui-smoke.py', '!scripts/saf-finger-tap/**', '!scripts/verify_reused_build.py', '.github/workflows/alfred-android.yml', 'native/Cargo.lock']
  pull_request:
    paths: ['app/**', 'shared/**', 'feature-*/**', 'native/**', 'scripts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'core-dependency.json', '!**/*.md', '.github/workflows/alfred-android.yml', 'native/Cargo.lock']
permissions:
  contents: read
  actions: read
concurrency:
  group: alfred-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: inputs.reuse_build_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: alfred-api30-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'native/Cargo.lock', '**/gradle.lockfile', 'gradle/verification-metadata.xml') }}
          # Reuse compiled dependencies after a configuration-lock-only change;
          # Cargo locks and strict Gradle checksums still validate every build.
          restore-keys: alfred-api30-${{ runner.os }}-
      - name: Prepare pinned core fixtures
        run: python3 scripts/prepare_core.py
      - name: Independent core CLI and library checks
        run: |
          cargo check --locked --manifest-path .core/Cargo.toml --all-targets
          cargo check --locked --manifest-path .core/Cargo.toml --no-default-features --lib
      - name: Native adapter host acceptance
        run: cargo test --release --locked --manifest-path native/Cargo.toml
      - run: bash scripts/build-linux.sh arm64-v8a
      - run: bash scripts/build-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-scaffold-api30
          path: build/ci/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfred-lint
          path: app/build/reports/lint-results-debug.*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: alfred-dependency-verification
          path: build/reports/dependency-verification/
          retention-days: 7
  verify-source:
    if: inputs.reuse_build_run != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: alfred-scaffold-api30
          run-id: ${{ inputs.reuse_build_run }}
          github-token: ${{ github.token }}
          path: build/verified-reuse
      - name: Require identical compiled source, engine pin and verified APK hashes
        run: python3 scripts/verify_reused_build.py build/verified-reuse
  emulator:
    needs: [build, verify-source]
    if: always() && !cancelled() && (needs.build.result == 'success' || needs.verify-source.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        api: ${{ fromJSON(inputs.apis || '[30,31,32,33,34,35,36]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alfred-scaffold-api30
          path: build/ci
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ALFRED_API30_PICKER_MANUAL: 'Infinix Hot 11S Android 11; owner-confirmed single/multiple/folder-subset UI on APK a1b3c42, 2026-10-08; task-results/A04.md. Replacement ALAC APK still needs owner retest.'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          script: python3 scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfred-emulator-api${{ matrix.api }}
          path: emulator-evidence/
          retention-days: 7
